  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#tile)"/>
  <g fill="#8ff0bc">
    <rect x="5" y="12" width="3" height="8" rx="1.5"/>
    <rect x="9.5" y="8" width="3" height="16" rx="1.5"/>
    <rect x="19.5" y="9" width="3" height="14" rx="1.5"/>
    <rect x="24" y="13" width="3" height="6" rx="1.5"/>
  </g>
  <rect x="15" y="6" width="2" height="20" rx="1" fill="#ff6f5e"/>
</svg>
