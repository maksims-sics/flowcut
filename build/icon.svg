<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- FlowCut app icon: a waveform with the silence cut out, the cut marked in coral -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a5a40"/>
      <stop offset="0.55" stop-color="#0e3426"/>
      <stop offset="1" stop-color="#071a13"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ffd6"/>
      <stop offset="1" stop-color="#45c486"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9b7a"/>
      <stop offset="1" stop-color="#ff5d55"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#7fe3ad" stroke-opacity="0.22" stroke-width="2"/>
  <g fill="url(#bar)">
    <rect x="40" y="103" width="18" height="50" rx="9"/>
    <rect x="68" y="76" width="18" height="104" rx="9"/>
    <rect x="96" y="54" width="18" height="148" rx="9"/>
    <rect x="142" y="62" width="18" height="132" rx="9"/>
    <rect x="170" y="86" width="18" height="84" rx="9"/>
    <rect x="198" y="108" width="18" height="40" rx="9"/>
  </g>
  <!-- the cut: two edit marks pointing at the closed gap -->
  <path d="M116 44 L140 44 L128 60 Z" fill="url(#cut)"/>
  <path d="M116 212 L140 212 L128 196 Z" fill="url(#cut)"/>
  <rect x="126" y="66" width="4" height="124" rx="2" fill="#ff7a66" opacity="0.85"/>
</svg>
